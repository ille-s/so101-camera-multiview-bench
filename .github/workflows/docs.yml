name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --upgrade pip
      # The package itself goes in without its runtime dependencies: conf.py
      # mocks every import autodoc would follow (torch, isaacsim, lerobot), so
      # installing them would cost minutes and change nothing in the output.
      # -e because conf.py reads the version through importlib.metadata.
      - run: pip install -e . --no-deps
      # The docs extra, resolved normally so the extensions get their own deps.
      - run: pip install '.[docs]'
      # Same flags as the "check" target in docs/Makefile: full rebuild, and
      # warnings are errors. An incremental build reports zero warnings for
      # pages it never re-read, and that false green hid two docutils errors.
      # -d keeps the doctree cache out of the output: it is Sphinx's internal
      # pickle, several megabytes of it, and it has no business being served.
      - run: sphinx-build -b html docs docs/_build/html -d docs/_build/doctrees -E -a -W -j auto
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

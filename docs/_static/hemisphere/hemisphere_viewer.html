<script>

const candidateColor = 0x4a9eff;
const usedColor = 0xe74c3c;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.01, 100);
camera.position.set(1.0, -0.9, 0.8);
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0.2);
controls.enableDamping = true;

scene.add(new THREE.GridHelper(2, 20, 0x333355, 0x222244));
const lookat = new THREE.Mesh(new THREE.SphereGeometry(0.02, 16, 16),
  new THREE.MeshBasicMaterial({color: 0x2ecc71}));
scene.add(lookat);

poses.forEach(p => {
  const r = p.used ? 0.03 : 0.018;
  const col = p.used ? usedColor : candidateColor;
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 16),
    new THREE.MeshBasicMaterial({color: col}));
  // three.js is Y-up; map (x,y,z)->(x, z, -y) so Z points up like the scene
  m.position.set(p.x, p.z, -p.y);
  scene.add(m);
  const lm = new THREE.LineBasicMaterial({color: 0x555577, transparent: true, opacity: p.used ? 0.5 : 0.2});
  const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(p.x, p.z, -p.y), new THREE.Vector3(0,0,0)]);
  scene.add(new THREE.Line(lg, lm));
});

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
animate();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body></html>
